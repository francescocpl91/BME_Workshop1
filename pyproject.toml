[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data"
version = "0.1.0"
description = "Auditable multi-provider daily price and macro-series retrieval"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "python-dateutil>=2.9,<3", "yfinance>=0.2.54,<2", "tzdata>=2024.1", "certifi>=2024.2.2"]

[tool.setuptools.packages.find]
where = ["src"]
